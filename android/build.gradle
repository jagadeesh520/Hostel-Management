// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google() // Must include for ML Kit
        mavenCentral()
        maven { url 'https://www.jitpack.io' } // Required for some RN plugins
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.8.2") // Updated Gradle plugin
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0")
    }
}

// Optional: reference to RN Android dir
def reactNativeAndroidDir = new File(
    providers.exec {
        workingDir(rootDir)
        commandLine("node", "--print", "require.resolve('react-native/package.json')")
    }.standardOutput.asText.get().trim(),
    "../android"
)

allprojects {
    repositories {
        google() // Must include for ML Kit
        mavenCentral()
        maven { url 'https://www.jitpack.io' }

        if (reactNativeAndroidDir.exists()) {
            maven { url(reactNativeAndroidDir) }
        }
    }
}

// Ensure all subprojects use the same repos
subprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }

        if (reactNativeAndroidDir.exists()) {
            maven { url(reactNativeAndroidDir) }
        }
    }
}

// Apply Expo and React Native Gradle plugins
apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
